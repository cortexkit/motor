[package]
name = "motor-winagent"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Bounded wire protocol for Motor's Windows job agent"

[features]
# Hyper-V COM transport and diagnostics; the default agent stays on virtio.
hyperv-spike = []
# Hyper-V experiment over a Hyper-V socket instead of the emulated COM port.
hyperv-hvsock = ["hyperv-spike"]
# Hyper-V runner profile: hvsock plus a small read-only per-job nonce DVD.
hyperv-runner = ["hyperv-hvsock"]

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tar = "0.4.44"
sha2 = "0.10.9"

[target.'cfg(windows)'.dependencies]
windows-service = "0.8.0"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Environment", "Win32_System_Ioctl", "Win32_System_Pipes", "Win32_System_SystemInformation", "Win32_Devices_Communication", "Win32_UI_Shell", "Win32_Networking_WinSock", "Win32_System_Hypervisor"] }
