[package]
name = "motor-runner"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Remote execution job queue, spool and workspace daemon"

[[bin]]
name = "motor-runner"
path = "src/main.rs"

[dependencies]
motor-lease = { path = "../motor-lease" }
ed25519-dalek.workspace = true
rand = "0.8"
motor-protocol = { path = "../motor-protocol" }
motor-winagent = { path = "../motor-winagent" }
tar = "0.4"
base64 = "0.22"
fs2 = "0.4"
libc = "0.2"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
url = "2"
tokio = { workspace = true, features = ["fs", "process", "signal"] }
toml = { version = "1.1.6", default-features = false, features = ["std", "parse", "serde"] }
tracing = { workspace = true }
zeroize.workspace = true
uuid = { version = "1", features = ["serde", "v7"] }

[target.'cfg(not(windows))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }

[target.'cfg(unix)'.dependencies]
cortexkit-cow = "=0.1.1"
# The remote compile cache gateway: HTTP/1.1 parsing, SigV4 signing and TLS to
# the object store.
hmac = "0.12"
httparse = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
motor-macvm = { path = "../motor-macvm" }

[target.'cfg(windows)'.dependencies]
# Schannel uses Windows' TLS implementation without a C compiler. Enabling
# rustls here would pull ring into the Linux-to-Windows clippy dependency graph.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "native-tls"] }
tokio = { workspace = true, features = ["io-std"] }
windows-service = "0.8.0"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Authentication_Identity", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Diagnostics_Debug", "Win32_System_Kernel", "Win32_System_Memory", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_System_Environment", "Win32_System_Pipes", "Win32_System_Power", "Win32_Networking_WinSock", "Win32_System_Hypervisor", "Win32_System_StationsAndDesktops", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi"] }

[dev-dependencies]
flate2 = "1"
cortexkit-test-support = "=0.1.10"
tokio = { workspace = true, features = ["test-util"] }
