[package]
name = "motor-runner"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Remote execution job queue, spool and workspace daemon"

[[bin]]
name = "motor-runner"
path = "src/main.rs"

[dependencies]
motor-protocol = { path = "../motor-protocol" }
motor-winagent = { path = "../motor-winagent" }
tar = "0.4"
cortexkit-cow = "=0.1.1"
base64 = "0.22"
fs2 = "0.4"
libc = "0.2"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
url = "2"
tokio = { workspace = true, features = ["fs", "process", "signal"] }
toml = { version = "1.1.6", default-features = false, features = ["std", "parse", "serde"] }
tracing = { workspace = true }
uuid = { version = "1", features = ["serde", "v7"] }

[dev-dependencies]
cortexkit-test-support = "=0.1.10"
rand = "0.8"
tokio = { workspace = true, features = ["test-util"] }
