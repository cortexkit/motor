[package]
name = "motor-module"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "ck-motor subc module serving exec-remote/v1"

[[bin]]
name = "ck-motor"
path = "src/main.rs"

[features]
bench-client = []

[[bin]]
name = "motor-bench-client-dev"
path = "../../scripts/bench-client.rs"
required-features = ["bench-client"]

[build-dependencies]
sha2 = "0.10"

[dependencies]
motor-protocol = { path = "../motor-protocol" }
motor-lease = { path = "../motor-lease" }
ed25519-dalek = { workspace = true }
hmac = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
x509-cert = "0.2"
cortexkit-claustrum-client = "=0.1.0"
# Named directly only for the caller-facing returned-file records, which
# motor-protocol shadows with its own runner-protocol types of the same names.
cortexkit-exec-remote-types = "=0.2.12"
cortexkit-store-types = { workspace = true }
subc-protocol = { workspace = true }
subc-client-rs = { workspace = true }
subc-os = { workspace = true }
subc-jsonc = { workspace = true }
base64 = "0.22"
fs2 = "0.4"
getrandom = "0.4"
libc = "0.2"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
subtle = "2.6"
ssh-key = { workspace = true }
toml = { version = "1.1.6", default-features = false, features = ["std", "parse", "serde"] }
tokio = { workspace = true, features = ["fs", "process", "signal"] }
tracing = { workspace = true }
uuid = { version = "1", features = ["serde", "v7"] }

[dev-dependencies]
# motor-host's helper trait returns anyhow results; the hosted relay test implements it.
anyhow = "1"
rcgen = "0.13"
subc-transport = { workspace = true }
motor-runner = { path = "../motor-runner" }
motor-host = { path = "../motor-host" }
cortexkit-test-support = "=0.1.10"
rand = "0.8"
tokio = { workspace = true, features = ["test-util"] }
