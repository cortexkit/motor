[package]
name = "motor-macvm"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = ["framework"]
framework = ["dep:objc2", "dep:objc2-foundation", "dep:objc2-virtualization", "dep:block2", "dep:objc2-app-kit"]

[[bin]]
name = "motor-macvm"
path = "src/main.rs"
required-features = ["framework"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
motor-winagent = { path = "../motor-winagent" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", optional = true }
objc2-foundation = { version = "0.3", optional = true }
objc2-virtualization = { version = "0.3", optional = true }
block2 = { version = "0.6", optional = true }
objc2-app-kit = { version = "0.3", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
cortexkit-test-support = "=0.1.10"
