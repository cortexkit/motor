[profile.default]
retries = 0
fail-fast = true
status-level = "slow"
final-status-level = "slow"
slow-timeout = { period = "120s", terminate-after = 2, grace-period = "60s" }

# These tests can skip at runtime when optional host tools are absent. Keep
# their output visible so an unavailable prerequisite is never a silent pass.
[[profile.default.overrides]]
filter = 'package(=motor-runner) and (test(=macos::tests::real_cargo_and_bun_ignore_hostile_config_and_lifecycle_scripts) or test(=macos::tests::bundled_private_commit_with_unreachable_url_preps_offline_and_missing_commit_refuses) or test(=macos::tests::ssh_git_source_with_bundled_commit_passes_preflight_and_password_is_refused))'
success-output = "immediate"

# The real-server harness includes two 90 s restart probes, full builds, and
# several 30-minute rebuild polls. It is ignored in every ordinary test lane.
[[profile.default.overrides]]
filter = 'package(=motor-module) and binary(=motor_e2e)'
slow-timeout = { period = "3600s", terminate-after = 6, grace-period = "60s" }

# The shared Cargo crate-cache benchmark compares two cold builds after mount setup.
[[profile.default.overrides]]
filter = 'test(=isolation::tests::cargo_cache::isolated_tenant_net_overlay_setup_on_large_cache)'
slow-timeout = { period = "600s", terminate-after = 2, grace-period = "60s" }
