[workspace]
resolver = "2"
exclude = ["crates/motor-winagent"]
members = [
    "crates/motor-lease",
    "crates/motor-protocol",
    "crates/motor-runner",
    "crates/motor-vm-guest",
    "crates/motor-vm-loader",
    "crates/motor-module",
    "crates/motor-vm-helper",
    "crates/prefrontal-build-slot",
]

# The runner reads these commands from the latest synchronized commit and
# precompiles test binaries in the background to speed up subsequent jobs.
[workspace.metadata.motor]
warm-commands = [
    "cargo nextest run --workspace --no-run",
    "cargo nextest run -p motor-module --lib --bins --no-run",
    "cargo nextest run -p motor-runner --lib --bins --no-run",
]

[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"

[workspace.dependencies]
subc-protocol = "=0.29.2"
subc-transport = "=0.10.0"
subc-client-rs = "=0.26.1"
subc-os = "=0.1.10"
subc-jsonc = "=0.1.1"
cortexkit-store-types = "=0.2.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
tracing = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
ed25519-dalek = { version = "2", default-features = false, features = ["std", "fast"] }
ssh-key = { version = "0.6", features = ["ed25519", "rand_core"] }
