# The Windows instance runs the Windows-VM backend from its own binary and state
# root. Start it only while the standing Windows build VM is stopped: both use
# the server's single Windows VM slot. Configure vm.toml and seal the job
# baseline before starting this instance.
# install-units.sh can append opt-in monitor metrics flags for this instance.
# Advertise 128 MiB returns with a 256 MiB disk reservation budget for one job.
[Service]
# One VM slot: at most 65,536 distinct Bun pins, plus 65,536 descriptors of
# headroom for preparation, control sockets and cleanup. Keep the hard ceiling.
LimitNOFILE=131072:524288
ExecStart=
ExecStart=/home/ubuntu/.cargo/bin/motor-runner-windows serve --instance windows --state-root /srv/build/motor-windows/windows/state --backend windows-vm --vm-config /srv/build/motor-windows/windows/vm.toml --return-chunked-max-bytes 134217728 --return-budget-bytes 268435456
