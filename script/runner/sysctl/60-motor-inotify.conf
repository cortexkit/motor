# Remote jobs all run as the one motor-job account, and the kernel counts
# inotify instances per account (default 128), so one job holding many could
# make inotify_init fail with EMFILE in every other job. Install on a runner
# host with:
#   sudo install -m 0644 60-motor-inotify.conf /etc/sysctl.d/ && sudo sysctl --system
fs.inotify.max_user_instances = 8192
