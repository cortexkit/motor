# Host logs (the systemd journal) are kept for at most 14 days. The privacy page
# states this limit, so every host type motor runs on carries it: the build
# server, hosted hosts, tenant VMs and Boat sandboxes. The existing size cap
# still applies, whichever limit is reached first. Install on a host with:
#   sudo install -D -m 0644 60-motor-retention.conf /etc/systemd/journald.conf.d/60-motor-retention.conf
#   sudo systemctl restart systemd-journald
[Journal]
MaxRetentionSec=14day
